<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DETAILS Project Pulse</title>
<style>
:root{--bg:#eef3f6;--panel:#fff;--ink:#0d2236;--muted:#5b6f80;--line:#d6e1e8;--navy:#0b2440;--teal:#0f9b95;--soft:#d8f1ef;
--rads:#8a1c2b;--ahkf:#1d3f7a;--ok:#1f8a4c;--warn:#c27c0e;--bad:#b4232f;--font:Calibri,Carlito,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button,input,select,textarea{font-family:var(--font);font-size:14px}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
.btn{cursor:pointer;border-radius:7px;padding:8px 14px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--teal)}.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* login */
#login{min-height:100%;display:grid;place-items:center;background:var(--navy);padding:16px}
.card{background:var(--panel);border-radius:12px;padding:28px;width:100%;max-width:380px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--teal);display:grid;place-items:center;font-weight:700;font-size:20px;color:#04101c}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}.brand b{letter-spacing:.14em;display:block}.brand span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--navy);color:#dfe9f1;padding:20px 12px;display:flex;flex-direction:column;gap:16px}
aside .brand span{color:#9fb6c7}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:7px;color:#c4d4e0;display:flex;justify-content:space-between;gap:8px}
nav button:hover{background:#ffffff14}nav button.on{background:var(--teal);color:#04101c;font-weight:700}
nav .n{font-size:12px;background:#ffffff22;border-radius:9px;padding:0 7px}nav button.on .n{background:#04101c22}
.who{margin-top:auto;font-size:13px;color:#9fb6c7;border-top:1px solid #ffffff1f;padding-top:12px}
.who b{color:#fff;display:block}.who a{color:var(--teal);cursor:pointer}
main{padding:22px max(16px,2vw);min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters>*{width:auto;min-width:150px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:4px solid transparent}
.item:hover{background:#f5f9fb}.item:last-child{border-bottom:0}
.item.s-bad{border-left-color:var(--bad)}.item.s-warn{border-left-color:var(--warn)}.item.s-ok{border-left-color:var(--ok)}
.item .t{font-weight:700}.item .m{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.right{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:#1f8a4c22;color:var(--ok)}.p-warn{background:#c27c0e26;color:var(--warn)}.p-bad{background:#b4232f22;color:var(--bad)}.p-info{background:var(--soft);color:var(--teal)}.p-mute{background:#5b6f8022;color:var(--muted)}
.e{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;color:#fff}.e-RADS{background:var(--rads)}.e-AHKF{background:var(--ahkf)}.e-Both{background:var(--teal)}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:#04101c80;display:flex;justify-content:flex-end;z-index:5}
.drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow:auto;padding:20px}
.modal{background:var(--panel);margin:auto;border-radius:12px;padding:22px;width:min(560px,94%);max-height:92%;overflow:auto}
.scrim.center{justify-content:center;align-items:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.meta{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px}.meta dt{color:var(--muted)}.meta dd{margin:0}
.tl{display:flex;flex-direction:column;gap:12px}
.up{display:grid;grid-template-columns:34px 1fr;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.up .h{font-size:13px;color:var(--muted)}.up .h b{color:var(--ink)}.up .x{white-space:pre-wrap;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--soft);color:var(--teal);font-size:13px;padding:2px 8px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.chip button{all:unset;cursor:pointer;font-weight:700}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.types button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.types button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:9}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{padding:12px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}.who{margin-top:0}.kpis{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}}
[hidden]{display:none!important}

.sp-logos{position:relative;display:flex;align-items:center;gap:32px;margin-bottom:26px;animation:splashPop .6s ease}
.sp-logos img{height:112px;width:auto;display:block}
.sp-sep{width:1px;height:64px;background:rgba(14,26,47,.3)}
.splash-title{position:relative;font-size:30px;font-weight:700;color:#0e1a2f;text-align:center;padding:0 20px}
.splash-sub{position:relative;font-size:14px;letter-spacing:.5px;margin:6px 0 22px;color:#24455f}
.sp-bar{position:relative;width:220px;height:4px;border-radius:4px;background:rgba(14,26,47,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1D9E75,#1f5fd0);animation:spLoad 3.2s ease forwards}
.sp-pill{position:absolute;bottom:26px;display:flex;align-items:center;gap:10px;background:#0e1a2f;color:#cfe3ee;padding:7px 18px 7px 8px;border-radius:30px;font-size:13px;box-shadow:0 6px 18px rgba(14,26,47,.3)}
.sp-pill img{width:26px;height:26px;border-radius:7px}.sp-pill b{color:#fff}
@keyframes splashPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes splashFade{0%{opacity:1}75%{opacity:1}100%{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes spLoad{to{width:100%}}
@media(max-width:560px){.sp-logos img{height:64px}.sp-logos{gap:20px}.splash-title{font-size:24px}}
@media(prefers-reduced-motion:reduce){.splash-shell{animation-duration:1.2s}.sp-bar i{animation-duration:1s}}
.logo{background:none!important;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.ents{display:flex;gap:10px;align-items:center;justify-content:center;margin:-4px 0 16px}.ents img{height:40px}.ents i{width:1px;height:28px;background:var(--line)}
</style></head>

<div id="layer"></div>

<script>
const S={token:null,d:null,view:'inbox',type:'Progress'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const call=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const api=(action,p)=>call('api',S.token,action,p||{}).catch(e=>{if(String(e.message).includes('SESSION_EXPIRED')){logout(true)}throw e});
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const name=e=>{const u=S.d.users.find(x=>x.email===String(e).toLowerCase());return u?u.name:e};
const ini=e=>name(e).split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const proj=id=>S.d.projects.find(p=>p.id===id);
const day=s=>s?String(s).slice(0,10):'';
const fmt=s=>{if(!s)return'';const d=new Date(String(s).replace(' ','T'));return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const when=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
const list=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
function stCls(t){if(t.status==='Completed')return['p-mute','ok'];if(t.overdue||t.status==='Delayed')return['p-bad','bad'];if(t.status==='At risk'||t.status==='Changed')return['p-warn','warn'];if(t.status==='On track')return['p-ok','ok'];return['p-info','']}

/* ---------- login ---------- */
$('#bCode').onclick=async()=>{const e=$('#lEmail').value.trim();if(!e)return;$('#lErr').textContent='';$('#bCode').disabled=true;
  try{await call('requestCode',e);$('#lShow').textContent=e;$('#step1').hidden=true;$('#step2').hidden=false;$('#lCode').focus()}catch(x){$('#lErr').textContent=x.message}$('#bCode').disabled=false};
$('#bVerify').onclick=async()=>{$('#lErr').textContent='';$('#bVerify').disabled=true;
  try{S.token=await call('verifyCode',$('#lEmail').value.trim(),$('#lCode').value.trim());ls.set('pp_t',S.token);await start()}catch(x){$('#lErr').textContent=x.message}$('#bVerify').disabled=false};
$('#bBack').onclick=e=>{e.preventDefault();$('#step2').hidden=true;$('#step1').hidden=false};
$('#lEmail').onkeydown=e=>{if(e.key==='Enter')$('#bCode').click()};$('#lCode').onkeydown=e=>{if(e.key==='Enter')$('#bVerify').click()};
function logout(expired){if(!expired&&S.token)api('logout').catch(()=>{});S.token=null;ls.set('pp_t',null);$('#app').hidden=true;$('#login').hidden=false;$('#step2').hidden=true;$('#step1').hidden=false;$('#layer').innerHTML='';if(expired)$('#lErr').textContent='Your session ended. Sign in again.'}
$('#bOut').onclick=()=>logout();

async function start(){S.d=await api('boot');$('#login').hidden=true;$('#app').hidden=false;
  $('#wName').textContent=S.d.me.name;$('#wRole').textContent=S.d.me.role+' · '+S.d.me.entity;
  $('#fProj').innerHTML='<option value="">All projects</option>'+S.d.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('#fStat').innerHTML='<option value="">Any status</option>'+S.d.statuses.map(s=>`<option>${s}</option>`).join('')+'<option value="__over">Overdue</option>';
  render();
  google.script.url.getLocation(l=>{const id=l.parameter&&l.parameter.task;if(id)openTask(id)});
}
async function reload(){S.d=await api('boot');render()}

/* ---------- views ---------- */
const isDir=()=>['Director','Admin'].includes(S.d.me.role);
function buckets(){const me=S.d.me.email,T=S.d.tasks,open=T.filter(t=>t.status!=='Completed');
  return{
    inbox:open.filter(t=>list(t.assignees).map(x=>x.toLowerCase()).includes(me)),
    tagged:open.filter(t=>list(t.watchers).map(x=>x.toLowerCase()).includes(me)&&!list(t.assignees).includes(me)),
    created:open.filter(t=>String(t.createdBy).toLowerCase()===me),
    all:isDir()?open:null,
    attention:isDir()?open.filter(t=>t.overdue||['Delayed','At risk','Changed'].includes(t.status)):null,
    closed:T.filter(t=>t.status==='Completed')}}
const VIEWS={inbox:['My tasks','Tasks you own'],tagged:['Tagged on','Tasks you were tagged on to stay informed'],created:['Assigned by me','Tasks you created for others'],all:['All open tasks','Director view across the entities you oversee'],attention:['Needs attention','Overdue, delayed, at risk or changed'],closed:['Closed','Completed tasks'],projects:['Projects','Milestone summary by project'],people:['People','Manage who can sign in']};
function render(){const b=buckets();
  const keys=['inbox','tagged','created'].concat(isDir()?['attention','all']:[]).concat(['closed','projects']).concat(S.d.me.role==='Admin'?['people']:[]);
  $('#nav').innerHTML=keys.map(k=>`<button data-v="${k}" class="${S.view===k?'on':''}">${VIEWS[k][0]}${b[k]?`<span class="n">${b[k].length}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(x=>x.onclick=()=>{S.view=x.dataset.v;render()});
  $('#vTitle').textContent=VIEWS[S.view][0];$('#vSub').textContent=VIEWS[S.view][1];
  const T=S.d.tasks.filter(t=>t.status!=='Completed');
  $('#kpis').innerHTML=[['Open',T.length],['On track',T.filter(t=>t.status==='On track'&&!t.overdue).length],['Delayed',T.filter(t=>t.status==='Delayed').length],['Overdue',T.filter(t=>t.overdue).length],['Closed',S.d.tasks.length-T.length]]
    .map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
  const adm=['projects','people'].includes(S.view);$('#vTasks').hidden=adm;$('#vAdmin').hidden=!adm;
  if(S.view==='projects')return projectsView();if(S.view==='people')return peopleView();
  const q=$('#fQ').value.toLowerCase(),fp=$('#fProj').value,fs=$('#fStat').value,fe=$('#fEnt').value;
  const rows=(b[S.view]||[]).filter(t=>(!fp||t.projectId===fp)&&(!fe||t.entity===fe)&&(!fs||(fs==='__over'?t.overdue:t.status===fs))
    &&(!q||(t.title+' '+t.id+' '+list(t.assignees).map(name).join(' ')).toLowerCase().includes(q)))
    .sort((a,b)=>(b.overdue-a.overdue)||day(a.dueDate).localeCompare(day(b.dueDate)));
  $('#list').innerHTML=rows.length?rows.map(t=>{const[c,s]=stCls(t),p=proj(t.projectId);
    return `<div class="item s-${s}" data-id="${esc(t.id)}" tabindex="0"><div><div class="t">${esc(t.title)}</div>
    <div class="m"><span>${esc(t.id)}</span>${t.entity?`<span class="e e-${esc(t.entity)}">${esc(t.entity)}</span>`:''}${p?`<span>${esc(p.name)}</span>`:''}<span>Owner: ${list(t.assignees).map(name).map(esc).join(', ')}</span></div></div>
    <div class="right"><span class="pill ${c}">${t.overdue?'Overdue':esc(t.status)}</span><span class="sub">${t.dueDate?'Due '+fmt(t.dueDate):'No due date'}${t.slipDays>0?` · slipped ${t.slipDays}d`:''}</span></div></div>`}).join('')
    :'<div class="empty">Nothing here. Tasks appear when someone tags you or you create one.</div>';
  $('#list').querySelectorAll('.item').forEach(i=>{i.onclick=()=>openTask(i.dataset.id);i.onkeydown=e=>{if(e.key==='Enter')openTask(i.dataset.id)}});
}
['#fQ','#fProj','#fStat','#fEnt'].forEach(s=>$(s).addEventListener('input',render));

function projectsView(){const T=S.d.tasks;
  $('#vAdmin').innerHTML=`<div class="box tw"><table><thead><tr><th>Project</th><th>Entity</th><th>Donor</th><th>Open</th><th>Delayed / overdue</th><th>Closed</th><th>Ends</th></tr></thead><tbody>${
    S.d.projects.map(p=>{const t=T.filter(x=>x.projectId===p.id),o=t.filter(x=>x.status!=='Completed');
    return `<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.id)}</div></td><td><span class="e e-${esc(p.entity)}">${esc(p.entity)}</span></td><td>${esc(p.donor)}</td><td>${o.length}</td><td>${o.filter(x=>x.overdue||x.status==='Delayed').length}</td><td>${t.length-o.length}</td><td>${fmt(p.end)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No projects yet.</td></tr>'}</tbody></table></div>`
  +(isDir()?`<div class="box"><b>Add project</b><div class="row2" style="margin-top:10px"><input id="pN" placeholder="Project name"><input id="pD" placeholder="Donor">
    <select id="pE"><option>RADS</option><option>AHKF</option><option>Both</option></select><select id="pM"><option value="">Project manager</option>${S.d.users.map(u=>`<option value="${esc(u.email)}">${esc(u.name)}</option>`).join('')}</select>
    <div class="field"><label for="pS">Start</label><input id="pS" type="date"></div><div class="field"><label for="pEnd">End</label><input id="pEnd" type="date"></div></div>
    <button class="btn" id="pAdd">Add project</button></div>`:'');
  const b=$('#pAdd');if(b)b.onclick=async()=>{b.disabled=true;try{S.d=await api('saveProject',{name:$('#pN').value,donor:$('#pD').value,entity:$('#pE').value,manager:$('#pM').value,start:$('#pS').value,end:$('#pEnd').value});toast('Project added');start()}catch(e){toast(e.message)}b.disabled=false};
}
function peopleView(){const U=S.d.allUsers||[];
  $('#vAdmin').innerHTML=`<div class="box"><b>Add or update a person</b><div class="row2" style="margin-top:10px"><input id="uE" type="email" placeholder="Email"><input id="uN" placeholder="Full name">
    <select id="uR">${S.d.roles.map(r=>`<option ${r==='Employee'?'selected':''}>${r}</option>`).join('')}</select><select id="uEn"><option>RADS</option><option>AHKF</option><option>Both</option></select>
    <input id="uD" placeholder="Department"><select id="uA"><option>Yes</option><option value="No">No (deactivate)</option></select></div><button class="btn" id="uSave">Save person</button></div>
    <div class="box tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Entity</th><th>Department</th><th>Active</th></tr></thead><tbody>${U.map(u=>`<tr data-e="${esc(u.email)}" style="cursor:pointer"><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.entity)}</td><td>${esc(u.department)}</td><td>${esc(u.active)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#vAdmin').querySelectorAll('tr[data-e]').forEach(r=>r.onclick=()=>{const u=U.find(x=>x.email===r.dataset.e);$('#uE').value=u.email;$('#uN').value=u.name;$('#uR').value=u.role;$('#uEn').value=u.entity;$('#uD').value=u.department;$('#uA').value=u.active==='No'?'No':'Yes'});
  $('#uSave').onclick=async()=>{const b=$('#uSave');b.disabled=true;try{S.d=await api('saveUser',{email:$('#uE').value,name:$('#uN').value,role:$('#uR').value,entity:$('#uEn').value,department:$('#uD').value,active:$('#uA').value});toast('Saved');render()}catch(e){toast(e.message)}b.disabled=false};
}

/* ---------- people picker ---------- */
function picker(el,initial,label){let sel=[...(initial||[])];const id='dl'+Math.random().toString(36).slice(2,7);
  function draw(){el.innerHTML=`<input list="${id}" placeholder="${label}"><datalist id="${id}">${S.d.users.filter(u=>!sel.includes(u.email)).map(u=>`<option value="${esc(u.name)} <${esc(u.email)}>"></option>`).join('')}</datalist><div class="tags">${sel.map(e=>`<span class="chip">@${esc(name(e))}<button data-e="${esc(e)}" aria-label="Remove">×</button></span>`).join('')}</div>`;
    const inp=el.querySelector('input');inp.onchange=()=>{const m=inp.value.match(/<([^>]+)>/);if(m&&!sel.includes(m[1])){sel.push(m[1]);draw();el.querySelector('input').focus()}};
    el.querySelectorAll('.chip button').forEach(b=>b.onclick=()=>{sel=sel.filter(x=>x!==b.dataset.e);draw()})}
  draw();return()=>sel}

/* ---------- new task ---------- */
$('#bNew').onclick=()=>{
  $('#layer').innerHTML=`<div class="scrim center"><div class="modal"><h2 style="margin-top:0">New task</h2>
   <div class="field"><label for="nT">Task</label><input id="nT" placeholder="e.g. Submit Q3 interim financial report to UN Women"></div>
   <div class="row2"><div class="field"><label for="nP">Project</label><select id="nP"><option value="">General / operations</option>${S.d.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.entity)})</option>`).join('')}</select></div>
   <div class="field"><label for="nD">Due date</label><input id="nD" type="date"></div></div>
   <div class="field"><label>Owner(s) — only they, people you tag and directors will see this task</label><div id="nA"></div></div>
   <div class="field"><label>Keep informed (optional)</label><div id="nW"></div></div>
   <div class="row2"><div class="field"><label for="nPr">Priority</label><select id="nPr"><option>Normal</option><option>High</option><option>Critical</option></select></div>
   <div class="field"><label for="nE">Entity (if no project)</label><select id="nE"><option>RADS</option><option>AHKF</option><option>Both</option></select></div></div>
   <div class="field"><label for="nDe">Details</label><textarea id="nDe" rows="4"></textarea></div>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="nX">Cancel</button><button class="btn" id="nGo">Create and notify</button></div><div class="err" id="nErr"></div></div></div>`;
  const ga=picker($('#nA'),[],'Type a name to tag the owner'),gw=picker($('#nW'),[],'Type a name to keep someone informed');
  $('#nX').onclick=()=>$('#layer').innerHTML='';
  $('#nGo').onclick=async()=>{const b=$('#nGo');b.disabled=true;$('#nErr').textContent='';
    try{const id=await api('createTask',{title:$('#nT').value,projectId:$('#nP').value,dueDate:$('#nD').value,assignees:ga(),watchers:gw(),priority:$('#nPr').value,entity:$('#nE').value,description:$('#nDe').value});
      $('#layer').innerHTML='';toast(id+' created. Owners have been emailed.');await reload()}catch(e){$('#nErr').textContent=e.message}b.disabled=false};
  $('#nT').focus();
};

/* ---------- task drawer ---------- */
async function openTask(id){
  $('#layer').innerHTML='<div class="scrim"><div class="drawer"><p class="sub">Loading…</p></div></div>';
  try{drawTask(await api('task',{id}))}catch(e){$('#layer').innerHTML='';toast(e.message)}}
function drawTask(t){const[c]=stCls(t),p=proj(t.projectId),closed=t.status==='Completed';
  const types=closed?(t.canClose?['Reopen']:[]):['Progress','Delay','Change','Comment'].concat(t.canClose?['Completed']:[]);
  if(!types.includes(S.type))S.type=types[0];
  const icon={Created:'Created the task',Progress:'Progress update',Delay:'Reported a delay',Change:'Reported a change',Comment:'Comment',Completed:'Closed the task',Reopen:'Reopened the task'};
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="drawer">
   <div style="display:flex;justify-content:space-between;gap:10px"><span class="sub">${esc(t.id)} ${t.entity?`<span class="e e-${esc(t.entity)}">${esc(t.entity)}</span>`:''}</span><button class="btn ghost sm" id="dX">Close panel</button></div>
   <h2 style="margin:6px 0 10px">${esc(t.title)}</h2>
   <div class="box"><dl class="meta">
    <dt>Status</dt><dd><span class="pill ${c}">${t.overdue?'Overdue · ':''}${esc(t.status)}</span></dd>
    <dt>Project</dt><dd>${p?esc(p.name)+' · '+esc(p.donor||''):'General / operations'}</dd>
    <dt>Owner(s)</dt><dd>${list(t.assignees).map(name).map(esc).join(', ')}</dd>
    <dt>Tagged</dt><dd>${list(t.watchers).map(name).map(esc).join(', ')||'—'}</dd>
    <dt>Due</dt><dd>${fmt(t.dueDate)||'—'}${t.slipDays?` <span class="pill p-warn">${t.slipDays>0?'+':''}${t.slipDays} days vs original ${fmt(t.originalDue)}</span>`:''}</dd>
    <dt>Created</dt><dd>${esc(name(t.createdBy))} · ${when(t.createdAt)}</dd>
    <dt>Priority</dt><dd>${esc(t.priority)}</dd></dl></div>
   ${types.length?`<div class="box"><b>Post an update</b><div class="types" style="margin-top:8px">${types.map(x=>`<button data-t="${x}" class="${S.type===x?'on':''}">${{Progress:'Progress',Delay:'Report delay',Change:'Report change',Comment:'Comment',Completed:'Mark complete',Reopen:'Reopen'}[x]}</button>`).join('')}</div>
    ${S.type==='Progress'?`<div class="field"><label for="uS">Status</label><select id="uS">${['On track','At risk'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
    ${['Delay','Change'].includes(S.type)?`<div class="field"><label for="uDue">Revised due date</label><input id="uDue" type="date" value="${day(t.dueDate)}"></div>`:''}
    <div class="field"><label for="uT">${S.type==='Delay'?'Reason for delay and recovery plan':S.type==='Change'?'What changed and why':'Message'}</label><textarea id="uT" rows="3"></textarea></div>
    <div class="field"><label>Tag people (they get access and an email)</label><div id="uM"></div></div>
    <button class="btn" id="uGo">Post</button><div class="err" id="uErr"></div></div>`:''}
   <div class="box"><b>Activity</b><div class="tl" style="margin-top:10px">${t.updates.slice().reverse().map(u=>`<div class="up"><div class="av">${esc(ini(u.by))}</div><div>
    <div class="h"><b>${esc(name(u.by))}</b> · ${icon[u.type]||esc(u.type)} · ${when(u.at)}</div>
    ${u.newStatus||u.newDue?`<div class="tags">${u.newStatus?`<span class="pill p-info">${esc(u.newStatus)}</span>`:''}${u.newDue?`<span class="pill p-warn">Due ${fmt(u.newDue)}</span>`:''}</div>`:''}
    ${u.text?`<div class="x">${esc(u.text)}</div>`:''}${u.mentions?`<div class="tags">${list(u.mentions).map(m=>`<span class="chip">@${esc(name(m))}</span>`).join('')}</div>`:''}</div></div>`).join('')}</div></div>
  </div></div>`;
  $('#dX').onclick=()=>$('#layer').innerHTML='';
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')$('#layer').innerHTML=''};
  $('#layer').querySelectorAll('.types button').forEach(b=>b.onclick=()=>{S.type=b.dataset.t;drawTask(t)});
  if(!types.length)return;
  const gm=picker($('#uM'),[],'Type a name to tag');
  $('#uGo').onclick=async()=>{const b=$('#uGo');b.disabled=true;$('#uErr').textContent='';
    try{const nt=await api('update',{id:t.id,type:S.type,text:$('#uT').value,status:$('#uS')?$('#uS').value:'',newDue:$('#uDue')?$('#uDue').value:'',mentions:gm()});
      toast('Update posted');drawTask(nt);reload()}catch(e){$('#uErr').textContent=e.message}b.disabled=false};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#layer').innerHTML=''});

/* ---------- splash ---------- */
setTimeout(()=>{const s=document.getElementById('splashShell');if(s)s.style.display='none'},4000);
/* ---------- resume session ---------- */
(async()=>{const t=ls.get('pp_t');if(!t)return;S.token=t;try{await start()}catch(e){S.token=null;ls.set('pp_t',null)}})();
</script>
</body></html>
